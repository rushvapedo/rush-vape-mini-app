<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rush Vape</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="ageGate" class="age-gate">
    <div class="age-card">
      <img src="assets/logo.jpg" class="age-logo" alt="Rush Vape">
      <h1>Rush Vape</h1>
      <p>Магазин товаров для вейпинга.</p>
      <p class="age-warning">Только для совершеннолетних.</p>
      <button id="ageConfirm" class="primary-btn">Мне есть 18 лет</button>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.jpg" alt="Rush Vape">
      <div>
        <strong>Rush Vape</strong>
        <span>вейп-шоп</span>
      </div>
    </div>
    <button id="cartTop" class="icon-btn" aria-label="Корзина">🛒<b id="cartCount">0</b></button>
  </header>

  <main>
    <section class="search-wrap">
      <input id="search" type="search" placeholder="Поиск товаров">
    </section>

    <section>
      <h2>Категории</h2>
      <div id="categories" class="categories"></div>
    </section>

    <section>
      <div class="section-head">
        <h2 id="sectionTitle">Популярное</h2>
        <button id="clearCategory" class="link-btn hidden">Все товары</button>
      </div>
      <div id="products" class="products"></div>
    </section>
  </main>

  <div id="cartSheet" class="sheet hidden">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2>Корзина</h2>
        <button id="closeCart" class="icon-btn">✕</button>
      </div>
      <div id="cartItems"></div>
      <div class="cart-total"><span>Итого</span><strong id="cartTotal">0 ₽</strong></div>
      <button id="orderBtn" class="primary-btn">Оформить заказ</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
